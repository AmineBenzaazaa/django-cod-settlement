# Local stack: API + Celery worker + PostgreSQL + Redis.
#   docker compose up --build
#   docker compose exec web python manage.py seed_demo
x-app: &app
  build: .
  env_file: .env.example
  environment:
    DATABASE_URL: postgres://cod:cod@db:5432/cod_settlement
    CELERY_BROKER_URL: redis://redis:6379/0
    DJANGO_DEBUG: "true"
    DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,web"
  volumes:
    - media:/app/media  # uploaded CSVs must be visible to both web and worker
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info --concurrency=2

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cod_settlement
      POSTGRES_USER: cod
      POSTGRES_PASSWORD: cod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cod -d cod_settlement"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  media:
