[project]
name = "django-cod-settlement"
version = "0.1.0"
description = "Cash-on-delivery courier settlement and remittance reconciliation API (Django + DRF + Celery)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.7.0",
    "django>=5.2,<6",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.3.9",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "config/wsgi.py", "config/asgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF"]
ignore = ["RUF012"]  # mutable class attrs are idiomatic in Django Meta/DRF classes

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
